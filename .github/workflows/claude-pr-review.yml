name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in CLAUDE.md.

            Look for:
            - correctness bugs and unhandled edge cases
            - wrong PROV / CPM semantics (bundle-scoped IDs, edge direction, specializationOf, connectors between bundles)
            - security problems
            - missing or weak tests for changed behaviour

            Also check the process rules:
            - the PR title is a Conventional Commit
            - the PR targets `development` (or is a release PR from `development` into `main`)
            - the description references an issue with "Closes #<n>"

            Be concise. Leave inline comments only for concrete problems. Finish with one short
            summary comment. If you find nothing wrong, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
